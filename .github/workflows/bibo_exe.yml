name: bibo_exe

on:
  schedule:
    - cron: '0 12 * * 1-5' # 12:00 PM EDT / 11:00 AM EST, M-F

  workflow_dispatch:

jobs:
  run-bot:
    environment: alpaca_bibo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Run bot
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PAPERACC: ${{ secrets.PAPERACC }}
          LIVEACC: ${{ secrets.LIVEACC }}
          PAPERACCUUID: ${{ secrets.PAPERACCUUID }}
          ACCUUID: ${{ secrets.ACCUUID }}
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}

        run: python algorithm/BIBO/main.py


